<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Music Genre Classifier{% endblock %}</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #fffdf8; --ink: #1b2238; --muted: #5a6074; --line: #ddd6c6;
    --soft: #ece8de; --accent: #e4572e; --accent-ink: #ffffff; --good: #1f7a4d; --bad: #b3261e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a2e; --card: #1c2340; --ink: #f1efe8; --muted: #b0b6cc; --line: #333b5e;
      --soft: #283056; --accent: #ff7a55; --accent-ink: #141a2e; --good: #5fd39a; --bad: #ff8a80;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  a { color: var(--accent); }

  /* header + navigation, same on every page */
  .topbar { border-bottom: 1px solid var(--line); background: var(--card); }
  .topbar .inner { max-width: 960px; margin: 0 auto; padding: 14px 20px; display: flex;
                   align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--ink); text-decoration: none; }
  .eq { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
  .eq i { display: block; width: 4px; border-radius: 2px; background: var(--accent); }
  .eq i:nth-child(2n) { opacity: .55; }
  nav { display: flex; gap: 6px; }
  nav a { text-decoration: none; color: var(--muted); padding: 8px 14px; border-radius: 999px; font-weight: 600; }
  nav a:hover { color: var(--ink); }
  nav a.active { background: var(--ink); color: var(--bg); }

  main { max-width: 960px; margin: 0 auto; padding: 28px 20px 24px; }
  h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.02em; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .lead { color: var(--muted); margin: 0 0 22px; max-width: 62ch; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }

  button { font: inherit; cursor: pointer; border-radius: 10px; padding: 9px 14px;
           border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
                   font-weight: 600; padding: 11px 20px; }
  button.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 600; padding: 11px 20px; }
  button:disabled { cursor: default; opacity: .55; }

  /* probability bars, shared by both pages */
  .bar { display: grid; grid-template-columns: 6.5rem 1fr 3.2rem; gap: 10px; align-items: center; padding: 5px 0; }
  .bar .name { font-weight: 600; }
  .bar .track { background: var(--soft); border-radius: 999px; height: 12px; overflow: hidden; }
  .bar .fill { background: var(--accent); height: 100%; border-radius: 999px; transition: width .35s ease; }
  .bar .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .empty { color: var(--muted); margin: 0; }
  .error { color: var(--bad); margin: 0; }
  @media (prefers-reduced-motion: reduce) { .bar .fill { transition: none; } }

  footer { max-width: 960px; margin: 0 auto; padding: 0 20px 32px; color: var(--muted); font-size: .85rem; }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<header class="topbar">
  <div class="inner">
    <a class="brand" href="/game">
      <span class="eq" aria-hidden="true"><i style="height:8px"></i><i style="height:16px"></i><i style="height:11px"></i><i style="height:20px"></i><i style="height:13px"></i></span>
      Music Genre Classifier
    </a>
    <nav aria-label="Main">
      <a href="/game" class="{% block nav_game %}{% endblock %}">Beat the AI</a>
      <a href="/" class="{% block nav_explore %}{% endblock %}">Explore</a>
    </nav>
  </div>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer id="footer">Model genre-classifier, loading...</footer>

<script>
  // shared helpers
  const $ = (id) => document.getElementById(id);

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function renderBars(target, top3) {
    target.innerHTML = top3.map((p) => {
      const pct = Math.round(p.proba * 100);
      return `<div class="bar"><span class="name">${escapeHtml(p.genre)}</span>` +
             `<div class="track"><div class="fill" style="width:${pct}%"></div></div>` +
             `<span class="pct">${pct}%</span></div>`;
    }).join("");
  }

  function setFooter(name, version) {
    $("footer").textContent = `Model ${name}, version ${version}`;
  }

  async function predict(features) {
    const res = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(features),
    });
    if (res.status === 503) throw new Error("The model is not ready yet, try again in a few seconds.");
    if (!res.ok) throw new Error(`The API refused these values (code ${res.status}).`);
    const data = await res.json();
    setFooter(data.model_name, data.model_version);
    return data;
  }

  fetch("/model-info")
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((i) => setFooter(i.model_name, i.model_version))
    .catch(() => { $("footer").textContent = "Model genre-classifier, version unavailable"; });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
