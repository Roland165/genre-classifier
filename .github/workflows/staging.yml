name: staging

# Runs when a PR dev -> staging is merged.
# Builds the release candidate image (tagged with the commit SHA), pushes it to GHCR,
# then runs it inside the runner against the real MLflow registry and smoke-tests it.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Start container with the real registry
        # -e NAME without a value passes the variable from the job env (secrets stay out of the command line)
        run: >
          docker run -d --name app -p 8000:8000
          -e MLFLOW_TRACKING_URI -e MLFLOW_TRACKING_USERNAME -e MLFLOW_TRACKING_PASSWORD
          -e MODEL_NAME=genre-classifier -e MODEL_ALIAS=champion
          "$IMAGE"

      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt requests python-dotenv

      - name: Smoke test (champion version + this commit's image)
        run: |
          EXPECTED=$(python -m ml.get_champion_version)
          echo "Champion in registry: $EXPECTED"
          python scripts/smoke_test.py --url http://localhost:8000 \
            --expected-version "$EXPECTED" --expected-sha "$GITHUB_SHA" --timeout 180

      - name: Container logs
        if: always()
        run: docker logs app || true

      - name: Summary
        if: success()
        run: |
          echo "Release candidate OK: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
