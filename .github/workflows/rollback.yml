name: rollback

# Manual trigger: move the champion alias back to an already approved version,
# refresh prod, and check with a live prediction that prod serves that version.
# ml/rollback.py refuses versions that don't exist or were never approved.
on:
  workflow_dispatch:
    inputs:
      model_version:
        description: Approved model version to restore (registry version number)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: model-registry
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      PROD_URL: ${{ secrets.PROD_URL }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      TARGET_VERSION: ${{ inputs.model_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt requests python-dotenv

      - name: Move champion alias to the target version
        run: python -m ml.rollback --version "$TARGET_VERSION"

      - name: Refresh production
        run: bash scripts/refresh_prod.sh

      - name: Verify live version
        run: python scripts/smoke_test.py --url "$PROD_URL" --expected-version "$TARGET_VERSION" --timeout 900

      - name: Summary
        if: always()
        run: |
          echo "### Rollback to version ${TARGET_VERSION}: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
