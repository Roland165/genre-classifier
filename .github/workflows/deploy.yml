name: deploy-prod

# Runs when a PR staging -> main is merged.
# Builds the image for this commit, pushes it to GHCR, tells Render to deploy exactly
# that image (deploy hook + imgURL), then smoke-tests the live URL: the app must report
# this commit's SHA and the current champion version, and answer a real prediction.
on:
  push:
    branches: [main]
  workflow_dispatch:   # re-run = redeploy this commit's image

permissions:
  contents: read
  packages: write

concurrency:
  group: prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      PROD_URL: ${{ secrets.PROD_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy on Render
        # the hook URL already contains ?key=..., hence &imgURL=
        run: |
          ENC=$(python3 -c "import os, urllib.parse; print(urllib.parse.quote(os.environ['IMAGE'], safe=''))")
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${ENC}" > /dev/null
          echo "Deploy requested for $IMAGE"

      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt requests python-dotenv

      - name: Live smoke test (new SHA + champion version + real prediction)
        run: |
          EXPECTED=$(python -m ml.get_champion_version)
          echo "Champion in registry: $EXPECTED"
          python scripts/smoke_test.py --url "$PROD_URL" \
            --expected-version "$EXPECTED" --expected-sha "$GITHUB_SHA" --timeout 900

      - name: Summary
        run: |
          echo "Deployed \`$IMAGE\` to $PROD_URL" >> "$GITHUB_STEP_SUMMARY"
